    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            background-color: #0f1115;
            font-family: "Segoe UI", sans-serif;
            color: #e4e4e7;
        }

        .game-container {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .sidebar {
            width: 180px;
            padding: 20px;
            background-color: #171923;
            border: 1px solid #272a36;
            border-radius: 12px;
        }

        .sidebar h1 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .stat {
            margin-bottom: 18px;
        }

        .stat-label {
            font-size: .75rem;
            color: #8d93a6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 600;
            margin-top: 4px;
        }

        table {
            border-collapse: collapse;
            /* background-color: #171923; */
            border: 2px solid #272a36;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,.35);
        }

        td {
            width: 32px;
            height: 32px;
            border: 1px solid #232634;
            /* background-color: #171923; */

            color: transparent;
            font-size: 0;
            transition: background-color .08s linear;
        }

        .locked {
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
        }

        .controls {
            margin-top: 20px;
            font-size: .8rem;
            color: #8d93a6;
            line-height: 1.8;
        }

        .btn{
            width:100%;
            padding:.8rem;
            border:none;
            border-radius:8px;
            background:var(--accent);
            color:#0f172a;
            font-weight:600;
            cursor:pointer;
            transition:.2s;
            background-color: rgb(255, 79, 216);
        }

        /* .btn:hover{
            opacity:.9;
            transform:translateY(-1px);
        } */

        /* =========================== */

        .modal-overlay{
            display:none; /* Hidden by default */

            position:fixed;
            top:0;
            left:0;

            width:100%;
            height:100%;

            background:rgba(0,0,0,0.6);

            justify-content:center;
            align-items:center;

            z-index:9999;
        }

        .modal{
            width:420px;
            background:rgb(23, 25, 35);
            border-radius:14px;
            padding:32px;
            text-align:center;
            border:1px solid rgba(255, 79, 216, 0.15);
            box-shadow:
                0 0 25px rgba(255, 79, 216, 0.08);
        }

        .modal-title{
            color:rgb(255, 79, 216);
            font-size:1.4rem;
            font-weight:600;
            margin-bottom:18px;
        }

        .modal-text{
            color:rgba(255,255,255,0.85);
            line-height:1.6;
            margin-bottom:28px;
            font-size:0.95rem;
        }

        .button-group{
            display:flex;
            gap:12px;
        }

        button{
            flex:1;
            padding:12px;
            border-radius:8px;
            border:none;
            cursor:pointer;
            font-size:0.95rem;
            font-weight:600;
            transition:0.2s ease;
        }

        .btn-yes{
            background:rgb(255, 79, 216);
            color:white;
        }

        .btn-yes:hover{
            transform:translateY(-2px);
            box-shadow:
                0 0 10px rgba(255,79,216,.4),
                0 0 20px rgba(255,79,216,.2);
        }

        .btn-no{
            background:#0f1115;
            color:#ffffff;
            border:1px solid rgba(255,255,255,.08);
        }

        .btn-no:hover{
            background:rgba(255,255,255,.05);
            transform:translateY(-2px);
        }


    </style>

    <div class="modal-overlay" id="modal-overlay">

            </div>

            <div class="modal-text">
                Would you like to upload your score to our online leaderboard?
            </div>

            <div class="button-group">
                <button class="btn-yes" id="btn-yes">YES</button>
                <script>
                    document.getElementById("btn-yes").onclick = function () {
                        
                        document.getElementById("modal-overlay-2").style.display = "flex";
                    };
                </script>
                <button class="btn-no" id="btn-no">NO</button>
                <script>
                    document.getElementById("btn-no").onclick = function () {
                        
                        if(score > localStorage.getItem("score")){
                            localStorage.setItem("score", score);
                        }
                        window.location.reload();
                    };
                </script>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay-2">
        <div class="modal">
            <div class="modal-text">
                Please enter your 3 letter codename: 
            </div>

            <div>
                <input type="text" name="" id="name" maxlength="3" style="height: 50px; text-align: center; font-size: 20px; text-transform: capitalize;"
                oninput="this.value = this.value.toUpperCase()">
            </div>

            <div>
                <br>
            </div>

            <div class="button-group">
                <button class="btn-yes" id="btn-proceed">Proceed</button>
                <script>
                    document.getElementById("btn-proceed").onclick = function () {
                        
                        async function sendData() {
                        
                            const response = await fetch('https://localhost:7229/Leaderboard/LeaderboardAPI', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json; charset=utf-8'
                                },
                                body: JSON.stringify({
                                    Score: score, 
                                    Name: document.getElementById("name").value
                                })
                            });

                            const result = await response.json();
                            console.log(result);
                        }

                        // alert(score)
                        sendData();

                        window.location.href = "./leaderboard.html";
                    };
                    
                </script>
                <button class="btn-no" id="btn-cancel">Cancel</button>
                <script>
                    document.getElementById("btn-cancel").onclick = function () {

                        }
                        window.location.reload();
                    };
                </script>
            </div>
        </div>
    </div>
